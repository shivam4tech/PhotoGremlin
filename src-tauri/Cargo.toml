[package]
name = "photogremlin"
version = "0.1.0"
description = "PhotoGremlin - privacy-first local photo intelligence and organization tool"
authors = ["PhotoGremlin contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "photogremlin_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
chrono = { version = "0.4", features = ["serde"] }
walkdir = "2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "tiff"] }
kamadak-exif = "0.6"

[dev-dependencies]
chrono = { version = "0.4" }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"

[profile.dev]
opt-level = 1
